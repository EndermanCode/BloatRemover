[Preset]
Name=Standard Office Setup
Ids=chrome,adobereader,7zip,firefox,teamviewer,notepadpp,hpsa,office

[App.chrome]
Name=Google Chrome
Type=choco
Path=choco
Args=install googlechrome -y --ignore-checksum -f
Default=1

[App.adobereader]
Name=Adobe Reader
Type=choco
Path=choco
Args=install adobereader -y --ignore-checksum -f
Default=1

[App.7zip]
Name=7-Zip
Type=choco
Path=choco
Args=install 7zip -y --ignore-checksum -f
Default=1

[App.firefox]
Name=Mozilla Firefox
Type=choco
Path=choco
Args=install firefox -y --ignore-checksum -f
Default=1

[App.teamviewer]
Name=TeamViewer Host
Type=choco
Path=choco
Args=install teamviewer.host -y --ignore-checksum -f
Default=1

[App.notepadpp]
Name=Notepad++
Type=choco
Path=choco
Args=install notepadplusplus -y --ignore-checksum -f
Default=1

[App.hpsa]
Name=HP Support Assistant
Type=choco
Path=choco
Args=install hpsupportassistant -y --ignore-checksum -f
Default=1

[App.office]
Name=Microsoft 365 Business
Type=choco
Path=choco
Args=install office365business -y --ignore-checksum -f --params "/eula:TRUE" --execution-timeout=0
Default=1

[Power]
DisableFastStartup=1
EnableHibernateAC=1
HibernateACMinutes=0
EnableMonitorAC=1
MonitorACMinutes=30
EnableSleepAC=1
SleepACMinutes=0
EnableHibernateDC=1
HibernateDCMinutes=0
EnableMonitorDC=1
MonitorDCMinutes=10

[Join]
Enabled=0
Type=workgroup
Target=
Hostname=

; Custom EXE/MSI presets (stored in this same INI)
[CustomPreset.Example-7zip]
Name=7-Zip Offline EXE
Path=C:\Installers\7zip.exe
Args=/S

[CustomPreset.Example-TeamViewer]
Name=TeamViewer Host EXE
Path=C:\Installers\TeamViewer_Host.exe
Args=/S

; Local users
[User.ExampleUser]
Name=ExampleUser
Groups=Users

; Example for MSI
; [App.mymsi]
; Name=My MSI App
; Type=msi
; Path=C:\Installers\MyApp.msi
; Args=TRANSFORMS=Company.mst
; Default=0

; Example for EXE
; [App.myexe]
; Name=My EXE App
; Type=exe
; Path=C:\Installers\MyApp.exe
; Args=/S /quiet /norestart
; Default=0
